<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff3b45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Split Score</title>
    <meta name="description" content="A fast, customizable two-team scorekeeper." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scoreboard" id="scoreboard" aria-label="Scoreboard">
      <section class="team team-one" id="team-one" aria-label="First team">
        <p class="team-name" id="team-one-name">Me</p>
        <button class="score" id="team-one-score" aria-label="Add one point to Me">0</button>
        <div class="score-actions" aria-label="First team score controls">
          <button data-team="0" data-change="-1" aria-label="Subtract one point">−</button>
          <button data-team="0" data-change="1" aria-label="Add one point">+</button>
        </div>
      </section>

      <section class="team team-two" id="team-two" aria-label="Second team">
        <p class="team-name" id="team-two-name">You</p>
        <button class="score" id="team-two-score" aria-label="Add one point to You">0</button>
        <div class="score-actions" aria-label="Second team score controls">
          <button data-team="1" data-change="-1" aria-label="Subtract one point">−</button>
          <button data-team="1" data-change="1" aria-label="Add one point">+</button>
        </div>
      </section>

      <button class="reset-button" id="reset-button" aria-label="Reset both scores" title="Reset scores">↻</button>

      <nav class="utility-bar" aria-label="Scoreboard controls">
        <button id="swap-button" aria-label="Swap teams" title="Swap teams">⇄</button>
        <button id="settings-button" aria-label="Open settings" title="Settings">⚙</button>
      </nav>
    </main>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header class="settings-header">
          <div>
            <p class="eyebrow">Make it yours</p>
            <h1 id="settings-title">Scoreboard settings</h1>
          </div>
          <button class="close-button" id="close-settings" aria-label="Close settings">×</button>
        </header>

        <div class="settings-content">
          <section class="setting-group">
            <h2>Teams</h2>
            <div class="team-settings">
              <label>
                <span>First team</span>
                <input id="team-one-input" type="text" maxlength="18" autocomplete="off" />
              </label>
              <label class="color-field">
                <span>Color</span>
                <input id="team-one-color" type="color" />
              </label>
            </div>
            <div class="team-settings">
              <label>
                <span>Second team</span>
                <input id="team-two-input" type="text" maxlength="18" autocomplete="off" />
              </label>
              <label class="color-field">
                <span>Color</span>
                <input id="team-two-color" type="color" />
              </label>
            </div>
          </section>

          <section class="setting-group">
            <h2>Type & layout</h2>
            <label>
              <span>Font</span>
              <select id="font-select">
                <option value="system">Clean</option>
                <option value="rounded">Rounded</option>
                <option value="serif">Classic</option>
                <option value="mono">Mono</option>
              </select>
            </label>
            <fieldset>
              <legend>Screen direction</legend>
              <div class="segmented-control">
                <label><input type="radio" name="layout" value="auto" /><span>Auto</span></label>
                <label><input type="radio" name="layout" value="stacked" /><span>Stacked</span></label>
                <label><input type="radio" name="layout" value="side-by-side" /><span>Side by side</span></label>
              </div>
            </fieldset>
          </section>

          <section class="setting-group compact-setting">
            <div>
              <h2>Allow negative scores</h2>
              <p>Let scores go below zero.</p>
            </div>
            <label class="switch">
              <input id="negative-toggle" type="checkbox" />
              <span aria-hidden="true"></span>
            </label>
          </section>
        </div>

        <footer class="settings-footer">
          <button class="secondary-button" id="restore-defaults">Restore defaults</button>
          <button class="primary-button" id="done-settings">Done</button>
        </footer>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
